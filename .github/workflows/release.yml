name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release

      - name: Package app bundle
        run: |
          APP="QOpen.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "$(swift build -c release --show-bin-path)/qopen" "$APP/Contents/MacOS/QOpen"
          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>QOpen</string>
              <key>CFBundleIdentifier</key>
              <string>com.qopen.app</string>
              <key>CFBundleVersion</key>
              <string>${{ github.ref_name }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ github.ref_name }}</string>
              <key>CFBundleExecutable</key>
              <string>QOpen</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSUIElement</key>
              <true/>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSAccessibilityUsageDescription</key>
              <string>QOpen needs Accessibility access to monitor keyboard shortcuts and read the Dock layout.</string>
          </dict>
          </plist>
          PLIST

      - name: Create zip archive
        run: zip -r QOpen-${{ github.ref_name }}.zip QOpen.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: QOpen-${{ github.ref_name }}.zip
          generate_release_notes: true
